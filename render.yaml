# Render blueprint. Create the service from this file and the only manual
# step is choosing a name; DJANGO_SECRET_KEY is generated by Render.
services:
  - type: web
    name: matrix-dynamics-explorer
    runtime: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate --noinput
    startCommand: gunicorn mde.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      # Django treats a leading dot as a subdomain wildcard
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      # Render already terminates TLS and redirects to HTTPS
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.3"
